server:
  port: 9192

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  application:
    name: Order-service
  config:
    import: optional:configserver:http://localhost:9196

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

