server:
  port: 8989
spring:
  application:
    name: CLOUD-GATEWAY
  config:
    import: optional:configserver:http://localhost:9196

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: lb://Order-service
              predicates:
                - Path=/order/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: orderCircuitBreaker
                    fallbackUri: forward:/rollback/orderFallback
                    statusCodes:
                      - 500

            - id: payment-service
              uri: lb://Payment-Service
              predicates:
                - Path=/payment/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: paymentCircuitBreaker
                    fallbackUri: forward:/rollback/paymentFallback
                    statusCodes:
                      - 500
