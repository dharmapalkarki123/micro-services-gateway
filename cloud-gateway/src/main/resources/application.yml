spring:
  application:
    name: CLOUD-GATEWAY
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: lb://Order-service
              predicates:
                - Path=/order/**
            - id: payment-service
              uri: lb://Payment-Service
              predicates:
                - Path=/payment/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost

server:
  port: 8989