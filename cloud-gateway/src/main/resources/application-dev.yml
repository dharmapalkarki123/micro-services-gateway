server:
  port: 8989

spring:
  application:
    name: CLOUD-GATEWAY
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: lb://Order-service
              predicates:
                - Path=/order/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: order-service
                    fallbackUri: forward:/orderFallback
            - id: payment-service
              uri: lb://Payment-Service
              predicates:
                - Path=/payment/**
              filters:
                - name: CircuitBreaker
                  args:
                     name: payment-service
                     fallbackUri: forward:/paymentFallBack


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost



management:
  endpoints:
    web:
      exposure:
        include: hystrix.stream

hystrix:
  command:
    fallbackcmd:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 5000




